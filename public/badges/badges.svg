<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
  <!--
    RIZZ badge sprite — the Discord-language badge set.

    Every emblem is one solid, gradient-filled silhouette on a 24x24 grid with
    the glyph cut out in ink, so it reads at 20px beside a name and still holds
    detail at 120px in the showcase. Depth comes from three layers, never from
    filters: a tier gradient (light at the top), an engraved inner ring or rim
    highlight, and a small white specular. The glyph is always negative space.

    Families: silver medallions for common badges, lime emblems for earned
    signal, amber/red flames for streaks, and shields for honor (Verified,
    Top Rizzler, Early Supporter / HypeSquad Bravery). Discord's HypeSquad
    shield is the reference for the shield family: bold crest, deep gradient,
    black chevron.

    Palette resolves from bz-* custom properties when a theme defines them
    (fallbacks keep the sprite standalone for the share canvas). Gradient ids
    are unique per symbol: the sprite is inlined into the page, and the share
    card extracts one symbol at a time.
  -->
