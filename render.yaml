services:
  - type: web
    name: rizz
    runtime: node
    buildCommand: npm install --legacy-peer-deps --registry=https://registry.npmjs.org/ && npm run build
    startCommand: npm run preview
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: CHATSTORY_TTS_URL
        sync: false
      - key: CHATSTORY_TTS_MODEL
        sync: false
      - key: HF_TOKEN
        sync: false